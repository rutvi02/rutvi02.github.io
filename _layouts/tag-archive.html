---
layout: default
---

<header class="page-header">
  <h1 class="page-title">Posts Tagged: {{ page.tag }}</h1>
</header>

<div class="post-list">
  {% for post in site.posts %}
    {% if post.tags contains page.tag %}
      {% include blog-item-simple.html post=post %}
    {% endif %}
  {% endfor %}
</div>
